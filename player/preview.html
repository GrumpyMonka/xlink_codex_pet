<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>XLink Codex Pets — просмотр</title>
<style>body{margin:0;background:#242735;color:#eef1fa;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;max-width:720px;padding:24px}canvas{display:block;width:min(400px,85vw);height:min(400px,85vw);margin:auto}select,button{padding:10px;border:1px solid #666e85;border-radius:8px;background:#353b4e;color:white;margin:8px}p{color:#c3c9da;font-size:14px}a{color:#c7d5ff}</style>
<main><h1 id="name"></h1><canvas></canvas><select id="action"></select><label><input type="checkbox" id="reduced"> Без движения</label><p id="timing"></p><p id="license"></p><a id="source" rel="noreferrer" target="_blank">Лицензия / README</a><p id="error" role="alert"></p></main>
<script type="module">import{createCanvasPlayer}from'/player/player.mjs';import{manifest,imageUrl}from'/player/manifest.mjs';const name=document.querySelector('#name'),select=document.querySelector('#action'),timing=document.querySelector('#timing');name.textContent=manifest.name;document.querySelector('#license').textContent=(manifest.license.text||'');const source=document.querySelector('#source');if(manifest.license.url)source.href=manifest.license.url;else source.hidden=true;
const preview=structuredClone(manifest);preview.bindings=Object.fromEntries(Object.keys(preview.actions).map(a=>[a,{action:a}]));delete preview.idleSequence;for(const a of Object.keys(preview.actions)){const option=document.createElement('option');option.value=a;option.textContent=preview.actions[a].label||a;select.append(option);}select.value=preview.defaultAction;const image=new Image();image.src=imageUrl;await image.decode();window.petPlayer=createCanvasPlayer(document.querySelector('canvas'),preview,image,{onError:e=>document.querySelector('#error').textContent=e.message});function update(){petPlayer.update({state:select.value,reduced:document.querySelector('#reduced').checked});const frames=preview.actions[select.value].frames,ms=frames.reduce((n,f)=>n+f.durationMs,0);timing.textContent=`${frames.length} кадров · ${(ms/1000).toFixed(2)} с · исходные длительности кадров`;}select.onchange=update;document.querySelector('#reduced').onchange=update;update();</script>
